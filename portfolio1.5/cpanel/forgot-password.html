<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password | BrightForge</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="../assets/images/logo-mark.svg" type="image/svg+xml">

<script>
(function () {
  try {
    var saved = localStorage.getItem("bf-theme");
    var theme = (saved === "light" || saved === "dark") ? saved : "dark";
    document.documentElement.setAttribute("data-theme", theme);
  } catch (e) {
    document.documentElement.setAttribute("data-theme", "dark");
  }
})();
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css">

<link rel="stylesheet" href="../assets/css/theme.css">
<link rel="stylesheet" href="../assets/css/style.css">
<link rel="stylesheet" href="../assets/css/scrollbar.css">
<link rel="stylesheet" href="../assets/css/toast.css">
<link rel="stylesheet" href="../assets/css/responsive.css">
</head>
<body>

<div class="auth-shell">
  <div class="auth-particles" aria-hidden="true"></div>

  <div class="auth-card">
    <div class="auth-brand">
      <img src="../assets/images/logo-full-dark.svg" alt="BrightForge logo" class="bf-logo-img">
    </div>

    <div class="auth-heading">
      <h1>Forgot your password?</h1>
      <p>Enter your admin email and we'll send a verification code.</p>
    </div>

    <form id="cp-forgot-form" novalidate>
      <div class="bf-form-group">
        <label class="bf-form-label" for="forgot-email">Email</label>
        <input type="email" id="forgot-email" name="email" class="bf-form-control" placeholder="you@example.com" required>
        <span class="bf-form-error">Please enter a valid email address.</span>
      </div>

      <button type="submit" class="btn-bf btn-bf-primary btn-bf-block">
        <span class="btn-spinner"></span>
        <span class="btn-label">Send Reset Code</span>
      </button>
    </form>

    <div class="auth-footer-note">
      <a href="login.html" class="auth-link"><i class="fa-solid fa-arrow-left"></i> Back to login</a>
    </div>
  </div>
</div>

<div id="bf-toast-region" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/theme.js"></script>
<script src="../assets/js/toast.js"></script>
<script src="../assets/js/validation.js"></script>
<script src="../assets/js/admin.js"></script>
</body>
</html>
