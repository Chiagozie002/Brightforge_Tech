<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password | BrightForge</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="../assets/images/logo-mark.png" type="image/png">

<script>
(function () {
  try {
    var saved = localStorage.getItem("bf-theme");
    var theme = (saved === "light" || saved === "dark") ? saved : "dark";
    document.documentElement.setAttribute("data-theme", theme);
  } catch (e) {
    document.documentElement.setAttribute("data-theme", "dark");
  }
})();
</script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css">

<link rel="stylesheet" href="../assets/css/theme.css">
<link rel="stylesheet" href="../assets/css/style.css">
<link rel="stylesheet" href="../assets/css/scrollbar.css">
<link rel="stylesheet" href="../assets/css/toast.css">
<link rel="stylesheet" href="../assets/css/responsive.css">
</head>
<body>

<div class="auth-shell">
  <div class="auth-particles" aria-hidden="true"></div>

  <div class="auth-card">
    <div class="auth-brand">
      <img src="../assets/images/logo-full-dark.png" alt="BrightForge logo" class="bf-logo-img">
    </div>

    <div class="auth-heading">
      <h1>Set a new password</h1>
      <p>Choose a strong password you haven't used before.</p>
    </div>

    <form id="cp-reset-form" novalidate>
      <div class="bf-form-group">
        <label class="bf-form-label" for="reset-password">New Password</label>
        <div class="auth-input-wrap">
          <input type="password" id="reset-password" name="password" class="bf-form-control" placeholder="Enter a new password" required>
          <button type="button" class="auth-toggle-visibility" aria-label="Show password">
            <i class="fa-solid fa-eye"></i>
          </button>
        </div>
        <span class="bf-form-error">Password doesn't meet the requirements below.</span>

        <div class="pw-strength">
          <div class="pw-strength-track">
            <div class="pw-strength-seg"></div>
            <div class="pw-strength-seg"></div>
            <div class="pw-strength-seg"></div>
            <div class="pw-strength-seg"></div>
          </div>
          <div class="pw-strength-label"></div>
          <ul class="pw-requirements">
            <li data-req="length"><i class="fa-regular fa-circle"></i> At least 8 characters</li>
            <li data-req="upper"><i class="fa-regular fa-circle"></i> One uppercase letter</li>
            <li data-req="number"><i class="fa-regular fa-circle"></i> One number</li>
            <li data-req="special"><i class="fa-regular fa-circle"></i> One special character</li>
          </ul>
        </div>
      </div>

      <div class="bf-form-group">
        <label class="bf-form-label" for="reset-confirm">Confirm Password</label>
        <div class="auth-input-wrap">
          <input type="password" id="reset-confirm" name="confirm_password" class="bf-form-control" placeholder="Re-enter your password" required>
          <button type="button" class="auth-toggle-visibility" aria-label="Show password">
            <i class="fa-solid fa-eye"></i>
          </button>
        </div>
        <span class="bf-form-error">Passwords don't match.</span>
      </div>

      <button type="submit" class="btn-bf btn-bf-primary btn-bf-block">
        <span class="btn-spinner"></span>
        <span class="btn-label">Reset Password</span>
      </button>
    </form>

    <div class="auth-footer-note">
      <a href="login.html" class="auth-link"><i class="fa-solid fa-arrow-left"></i> Back to login</a>
    </div>
  </div>
</div>

<div id="bf-toast-region" role="status" aria-live="polite"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="../assets/js/theme.js"></script>
<script src="../assets/js/toast.js"></script>
<script src="../assets/js/validation.js"></script>
<script src="../assets/js/admin.js"></script>
</body>
</html>
